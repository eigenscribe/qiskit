[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-qubit-tools"
version = "0.1.0"
description = "Utilities for quantum circuit analysis and separability"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=0.45",
    "matplotlib>=3.6",
    "numpy>=1.23",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29",
    "ipython>=8.25",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
cond-prob = "src.utils.cond_probability:main"